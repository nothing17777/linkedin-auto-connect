<!doctype html>
<html>
<body style="width:220px;margin:0;padding:12px;font:13px system-ui">
  <b>LinkedIn Auto Connect</b><br><br>
  Max invites: <input id="max" type="number" value="20" min="1" max="100" style="width:55px"><br>
  Delay (sec): <input id="dmin" type="number" value="0.5" min="0.5" step="0.1" style="width:50px"> to <input id="dmax" type="number" value="3" min="0.5" step="0.1" style="width:50px"><br>
  <button id="btn" style="margin-top:8px;padding:5px 14px;background:#0a66c2;color:#fff;border:0;border-radius:12px;cursor:pointer">Start</button>
  <div id="status" style="margin-top:8px">Idle</div>
  <script src="popup.js"></script>
</body>
</html>
